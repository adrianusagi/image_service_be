spring:
  application:
    name: image-service-api
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  logging:
    level:
      root: info # Default for everyone
      com.example.demo: debug # Show detailed logs for ONLY your code
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.1.50}:${DB_PORT:3306}/${DB_NAME:image_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Automatically creates tables based on your Java objects
    show-sql: true     # Prints SQL queries in your terminal (great for debugging)
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.MySQL8Dialect